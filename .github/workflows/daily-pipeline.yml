name: Daily Market Pipeline

on:
  # GitHub 原生定时调度 (不依赖任何 PAT, GITHUB_TOKEN 自动可用, 永不因 token 过期断链)
  schedule:
    - cron: '0 22 * * *'   # UTC 22:00 = 北京 06:00 常规推送 (morning)
    - cron: '0 10 * * *'   # UTC 10:00 = 北京 18:00 市场复盘 (review, 收盘后)
  # 手动 / Vercel Cron 外部触发
  workflow_dispatch:
    inputs:
      mode:
        description: '运行模式: morning=常规推送, review=市场复盘'
        required: false
        default: 'morning'
        type: choice
        options:
          - morning
          - review

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install system deps (weasyprint / matplotlib / 中文字体)
        run: |
          sudo apt-get update
          sudo apt-get install -y libpango-1.0-0 libpangocairo-1.0-0 libgdk-pixbuf2.0-0 libffi-dev fonts-liberation fonts-wqy-zenhei

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Determine pipeline mode
        id: mode
        run: |
          # 手动/Vercel dispatch: inputs.mode 传入
          # GitHub schedule 触发: inputs 为空, 按 cron 表达式区分 (10:00 UTC = review, 其余 = morning)
          MODE="${{ github.event.inputs.mode || '' }}"
          if [ -z "$MODE" ]; then
            if [ "${{ github.event.schedule }}" = "0 10 * * *" ]; then
              MODE="review"
            else
              MODE="morning"
            fi
          fi
          echo "PIPELINE_MODE=${MODE}" >> $GITHUB_ENV
          echo "Mode: ${MODE}"

      - name: Run pipeline
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_HOST: smtp.qq.com
          SMTP_PORT: 465
          TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
          PIPELINE_MODE: ${{ env.PIPELINE_MODE }}
        run: python backend/runner.py all

      - name: Commit updated data files
        run: |
          git config user.name "Stock Agent Bot"
          git config user.email "bot@stock-agent.dev"
          git add data/latest.json data/latest_review.json data/raw_*.json data/processed_*.json data/analysis_*.json data/review_*.json data/review_*.pdf || true
          git diff --staged --quiet || git commit -m "📊 Update market data $(date -u +%Y-%m-%d) [${{ env.PIPELINE_MODE }}]"
          git push
