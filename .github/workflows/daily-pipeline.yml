name: Daily Market Pipeline

on:
  # 多重定时保障：GitHub Actions scheduled runs 经常延迟或跳过
  # 加 4 个 cron 时间点确保至少有一个能触发
  schedule:
    - cron: '0 22 * * *'     # 6:00 AM CST (主时间)
    - cron: '30 22 * * *'    # 6:30 AM CST (兜底1)
    - cron: '0 23 * * *'     # 7:00 AM CST (兜底2)
    - cron: '30 23 * * *'    # 7:30 AM CST (兜底3)
  # 允许手动触发（用于测试）
  workflow_dispatch:

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Run full pipeline (collect → process → analyze → report)
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_HOST: smtp.qq.com
          SMTP_PORT: 465
        run: node backend/runner-github.js all

      - name: Commit updated data files
        run: |
          git config user.name "Stock Agent Bot"
          git config user.email "bot@stock-agent.dev"
          git add data/latest.json data/raw_*.json data/processed_*.json data/analysis_*.json || true
          git diff --staged --quiet || git commit -m "📊 Update market data $(date -u +%Y-%m-%d)"
          git push
