name: Daily Market Pipeline

on:
  # 主要靠 Vercel Cron Jobs 触发 workflow_dispatch (保留单一调度源, 避免与 Vercel 重复触发早上推送)
  workflow_dispatch:
    inputs:
      mode:
        description: '运行模式: morning=常规推送, review=市场复盘'
        required: false
        default: 'morning'
        type: choice
        options:
          - morning
          - review

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Determine pipeline mode
        id: mode
        run: |
          # GitHub schedule 触发时 inputs 为空，默认 morning
          # Vercel Cron 触发时通过 inputs.mode 传入
          MODE="${{ github.event.inputs.mode || 'morning' }}"
          echo "PIPELINE_MODE=${MODE}" >> $GITHUB_ENV
          echo "Mode: ${MODE}"

      - name: Run pipeline
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_HOST: smtp.qq.com
          SMTP_PORT: 465
          TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
          PIPELINE_MODE: ${{ env.PIPELINE_MODE }}
        run: python backend/runner.py all

      - name: Commit updated data files
        run: |
          git config user.name "Stock Agent Bot"
          git config user.email "bot@stock-agent.dev"
          git add data/latest.json data/latest_review.json data/raw_*.json data/processed_*.json data/analysis_*.json data/review_*.json || true
          git diff --staged --quiet || git commit -m "📊 Update market data $(date -u +%Y-%m-%d) [${{ env.PIPELINE_MODE }}]"
          git push
