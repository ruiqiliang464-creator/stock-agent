name: Daily Market Pipeline

on:
  # GitHub 内部 cron 不靠谱，仅保留 1 个作为备用
  # 主要靠 Vercel Cron Jobs 触发 workflow_dispatch
  schedule:
    - cron: '0 22 * * *'     # 6:00 AM CST (备用)
  # 外部触发 (Vercel Cron) + 手动测试
  workflow_dispatch:

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run full pipeline (collect → process → analyze → report)
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_HOST: smtp.qq.com
          SMTP_PORT: 465
        run: python backend/runner.py all

      - name: Commit updated data files
        run: |
          git config user.name "Stock Agent Bot"
          git config user.email "bot@stock-agent.dev"
          git add data/latest.json data/raw_*.json data/processed_*.json data/analysis_*.json || true
          git diff --staged --quiet || git commit -m "📊 Update market data $(date -u +%Y-%m-%d)"
          git push
