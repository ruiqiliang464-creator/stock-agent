<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>每日市场复盘 · 交互看板</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
<style>
  :root {
    --bg: #f5f7fa; --card: #ffffff; --line: #e6e9ef; --text: #1f2937;
    --muted: #6b7280; --up: #e23b3b; --down: #16a34a; --brand: #2563eb;
    --accent: #7c3aed;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", Segoe UI, sans-serif; }
  header { background: linear-gradient(90deg, #1e3a8a, #2563eb); color: #fff;
    padding: 18px 24px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px; }
  header h1 { font-size: 20px; margin: 0; font-weight: 700; }
  header .meta { font-size: 13px; opacity: .9; }
  nav a { color: #dbeafe; text-decoration: none; font-size: 13px; border: 1px solid #93c5fd;
    padding: 4px 10px; border-radius: 6px; margin-left: 8px; }
  nav a:hover { background: #1d4ed8; }
  .summary { margin: 16px 24px; font-size: 14px; line-height: 1.7; color: #374151; }
  .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; padding: 0 24px 32px; }
  @media (max-width: 920px) { .grid { grid-template-columns: 1fr; } }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px;
    box-shadow: 0 1px 3px rgba(0,0,0,.04); }
  .card h2 { font-size: 15px; margin: 0 0 8px; display: flex; align-items: center; gap: 6px; }
  .card h2 .tag { font-size: 11px; font-weight: 600; color: var(--muted); background: #eef2ff;
    padding: 1px 7px; border-radius: 10px; }
  .chart { width: 100%; height: 300px; }
  .empty { height: 300px; display: flex; align-items: center; justify-content: center; color: var(--muted); font-size: 13px; }
  .kpis { display: flex; gap: 14px; flex-wrap: wrap; }
  .kpi { background: #f8fafc; border: 1px solid var(--line); border-radius: 8px; padding: 10px 14px; min-width: 90px; text-align: center; }
  .kpi .v { font-size: 22px; font-weight: 700; }
  .kpi .l { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .up { color: var(--up); } .down { color: var(--down); }
  .tabs { display: flex; gap: 6px; margin-bottom: 8px; }
  .tabs button { border: 1px solid var(--line); background: #fff; color: var(--text); padding: 5px 12px;
    border-radius: 6px; cursor: pointer; font-size: 13px; }
  .tabs button.active { background: var(--brand); color: #fff; border-color: var(--brand); }
  table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  th, td { text-align: right; padding: 5px 8px; border-bottom: 1px solid var(--line); }
  th:first-child, td:first-child, th:nth-child(2), td:nth-child(2) { text-align: left; }
  th { color: var(--muted); font-weight: 600; background: #f8fafc; }
  tr:hover td { background: #f1f5f9; }
  .toolbar { padding: 0 24px 8px; }
  .toolbar button { border: 1px solid var(--brand); background: #fff; color: var(--brand); padding: 6px 14px;
    border-radius: 6px; cursor: pointer; font-size: 13px; }
  .err { margin: 16px 24px; padding: 12px 16px; background: #fef2f2; border: 1px solid #fecaca;
    color: #b91c1c; border-radius: 8px; font-size: 13px; }
  .loading { padding: 40px; text-align: center; color: var(--muted); }
</style>
</head>
<body>
<header>
  <div>
    <h1>每日市场复盘 · 交互看板</h1>
    <div class="meta" id="meta">加载中…</div>
  </div>
  <nav>
    <a href="./index.html">行情看板</a>
    <a href="./review.html">复盘</a>
  </nav>
</header>

<div class="summary" id="summary"></div>
<div class="toolbar"><button onclick="window.print()">🖨 导出 / 打印 PDF</button></div>
<div id="root" class="loading">正在加载 latest_review.json …</div>

<script>
const COLORS = { up: '#e23b3b', down: '#16a34a', brand: '#2563eb', accent: '#7c3aed' };

function fmt(n, d=2) { return (n===null||n===undefined||isNaN(n)) ? '-' : Number(n).toFixed(d); }
function signColor(v) { return v > 0 ? COLORS.up : (v < 0 ? COLORS.down : '#6b7280'); }
function pc(v) { return (v>0?'+':'') + fmt(v); }

// 安全渲染: 无数据时显示占位
const charts = [];
function safeChart(id, option, hasData) {
  const el = document.getElementById(id);
  if (!hasData) { el.innerHTML = '<div class="empty">暂无数据</div>'; return; }
  const c = echarts.init(el, 'light'); charts.push(c); c.setOption(option);
}

function buildIndexChart(d) {
  const idx = (d.indices||[]);
  const names = idx.map(x=>x.name).reverse();
  const vals = idx.map(x=>x.change_pct).reverse();
  safeChart('c_index', {
    tooltip:{trigger:'axis', formatter:p=>{const i=p[0]; return `${i.name}<br/>涨跌幅: ${pc(i.value)}%`;}},
    grid:{left:90, right:30, top:14, bottom:24},
    xAxis:{type:'value', axisLabel:{formatter:'{value}%'}},
    yAxis:{type:'category', data:names, axisLabel:{fontSize:12}},
    series:[{type:'bar', data:vals.map(v=>({value:v, itemStyle:{color:signColor(v)}})),
      label:{show:true, position:'right', formatter:p=>pc(p.value)+'%', fontSize:11}, barWidth:'55%'}]
  }, idx.length>0);
}

function buildMarginChart(d) {
  const m = d.margin||{};
  const has = m.total_balance_yi!==undefined;
  const cats = ['融资余额','融券余额','融资买入额'];
  const vals = [m.finance_balance_yi, m.securities_balance_yi, m.financing_buy_yi];
  safeChart('c_margin', {
    tooltip:{trigger:'axis', formatter:p=>`${p[0].name}: ${fmt(p[0].value)}亿`},
    grid:{left:80, right:30, top:14, bottom:24},
    xAxis:{type:'category', data:cats},
    yAxis:{type:'value', axisLabel:{formatter:'{value}亿'}},
    series:[{type:'bar', data:vals.map(v=>({value:v||0, itemStyle:{color:COLORS.brand}})),
      label:{show:true, position:'top', formatter:p=>fmt(p.value)+'亿', fontSize:11}, barWidth:'45%'}]
  }, has);
}

function buildEtfChart(d) {
  const list = (d.etf_flow||[]);
  const items = list.filter(x=>x.main_net_inflow_yi!==undefined).sort((a,b)=>(a.main_net_inflow_yi||0)-(b.main_net_inflow_yi||0));
  const names = items.map(x=>x.name);
  const vals = items.map(x=>x.main_net_inflow_yi);
  safeChart('c_etf', {
    tooltip:{trigger:'axis', formatter:p=>`${p[0].name}<br/>主力净流入: ${fmt(p[0].value)}亿`},
    grid:{left:90, right:40, top:14, bottom:24},
    xAxis:{type:'value', axisLabel:{formatter:'{value}亿'}},
    yAxis:{type:'category', data:names, axisLabel:{fontSize:11}},
    series:[{type:'bar', data:vals.map(v=>({value:v, itemStyle:{color:signColor(v)}})),
      label:{show:true, position:'right', formatter:p=>fmt(p.value)+'亿', fontSize:10}, barWidth:'55%'}]
  }, items.length>0);
}

function buildSectorChart(d) {
  const list = (d.sector_flow||[]).filter(x=>x.net_inflow_yi!==undefined).slice(0,10).reverse();
  const names = list.map(x=>x.name);
  const vals = list.map(x=>x.net_inflow_yi);
  safeChart('c_sector', {
    tooltip:{trigger:'axis', formatter:p=>`${p[0].name}<br/>主力净流入: ${fmt(p[0].value)}亿`},
    grid:{left:90, right:40, top:14, bottom:24},
    xAxis:{type:'value', axisLabel:{formatter:'{value}亿'}},
    yAxis:{type:'category', data:names, axisLabel:{fontSize:11}},
    series:[{type:'bar', data:vals.map(v=>({value:v, itemStyle:{color:signColor(v)}})),
      label:{show:true, position:'right', formatter:p=>fmt(p.value)+'亿', fontSize:10}, barWidth:'55%'}]
  }, list.length>0);
}

function buildTrackChart(d) {
  const list = (d.track_crowding||[]).slice(0,8);
  const names = list.map(x=>x.track);
  const vals = list.map(x=>x.share_pct);
  safeChart('c_track', {
    tooltip:{trigger:'axis', formatter:p=>`${p[0].name}<br/>成交占比: ${fmt(p[0].value)}%`},
    grid:{left:80, right:30, top:14, bottom:24},
    xAxis:{type:'category', data:names, axisLabel:{fontSize:11, interval:0, rotate:18}},
    yAxis:{type:'value', axisLabel:{formatter:'{value}%'}},
    series:[{type:'bar', data:vals.map(v=>({value:v, itemStyle:{color: v>=15?COLORS.up:COLORS.accent}})),
      label:{show:true, position:'top', formatter:p=>fmt(p.value)+'%', fontSize:10}, barWidth:'50%'}]
  }, list.length>0);
}

function buildSentimentKpi(d) {
  const s = d.sentiment_pools||{};
  if (s.limit_up_count == null && s.zhaban_count == null) { document.getElementById('c_sentiment').innerHTML='<div class="empty">暂无数据</div>'; return; }
  const cards = [
    {l:'涨停', v:s.limit_up_count, c:COLORS.up},
    {l:'炸板', v:s.zhaban_count, c:'#f59e0b'},
    {l:'炸板率', v:s.zhaban_rate!==undefined?fmt(s.zhaban_rate)+'%':'-', c:'#f59e0b'},
    {l:'昨日涨停', v:s.yesterday_zt_count, c:COLORS.brand},
  ];
  document.getElementById('c_sentiment').innerHTML = '<div class="kpis">'+cards.map(c=>
    `<div class="kpi"><div class="v" style="color:${c.c}">${c.v===null?'-':c.v}</div><div class="l">${c.l}</div></div>`).join('')+'</div>';
}

function buildPvaChart(d) {
  const list = (d.price_volume_anomalies||[]);
  const types = ['放量突破','缩量回调','底部放量'];
  const palette = {放量突破:COLORS.up, 缩量回调:COLORS.down, 底部放量:COLORS.accent};
  const series = types.map(t=>({
    name:t, type:'scatter',
    data: list.filter(x=>x.type===t).map(x=>[x.vol_ratio, x.change_pct, x.name]),
    itemStyle:{color:palette[t]}, symbolSize:11
  }));
  safeChart('c_pva', {
    tooltip:{trigger:'item', formatter:p=>`${p.data[2]}<br/>量比: ${fmt(p.data[0])}<br/>涨跌幅: ${pc(p.data[1])}%`},
    legend:{data:types, top:0, textStyle:{fontSize:11}},
    grid:{left:50, right:24, top:34, bottom:40},
    xAxis:{type:'value', name:'量比', nameTextStyle:{fontSize:11}, axisLabel:{fontSize:11}},
    yAxis:{type:'value', name:'涨跌幅%', nameTextStyle:{fontSize:11}, axisLabel:{formatter:'{value}%', fontSize:11}},
    series
  }, list.length>0);
}

function buildLhbChart(d) {
  const list = ((d.lhb_capital||{}).lhb_institution||[]).slice().sort((a,b)=>(a.inst_net_buy_yi||0)-(b.inst_net_buy_yi||0));
  const names = list.map(x=>x.name);
  const vals = list.map(x=>x.inst_net_buy_yi);
  safeChart('c_lhb', {
    tooltip:{trigger:'axis', formatter:p=>`${p[0].name}<br/>机构净买: ${fmt(p[0].value)}亿`},
    grid:{left:80, right:40, top:14, bottom:24},
    xAxis:{type:'value', axisLabel:{formatter:'{value}亿'}},
    yAxis:{type:'category', data:names, axisLabel:{fontSize:11}},
    series:[{type:'bar', data:vals.map(v=>({value:v, itemStyle:{color:signColor(v)}})),
      label:{show:true, position:'right', formatter:p=>fmt(p.value)+'亿', fontSize:10}, barWidth:'55%'}]
  }, list.length>0);
}

let rankTab = 'top_inflow';
function renderRankTable(d) {
  const sr = d.stock_rank||{};
  const map = {top_inflow:'主力净流入 TOP', top_gainers:'涨幅 TOP', top_losers:'跌幅 TOP'};
  const data = sr[rankTab]||[];
  const head = '<tr><th>代码</th><th>名称</th><th>现价</th><th>涨跌幅</th><th>主力净流入(亿)</th><th>净占比%</th><th>行业</th></tr>';
  const rows = data.map(r=>`<tr>
    <td>${r.code||''}</td><td>${r.name||''}</td>
    <td>${fmt(r.close)}</td>
    <td class="${r.change_pct>0?'up':(r.change_pct<0?'down':'')}">${pc(r.change_pct)}</td>
    <td>${fmt(r.main_net_inflow_yi)}</td>
    <td>${fmt(r.main_net_pct)}</td>
    <td>${r.industry||'-'}</td></tr>`).join('');
  document.getElementById('rank_head').textContent = map[rankTab] + ` (${data.length})`;
  document.getElementById('rank_body').innerHTML = '<table>'+head+rows+'</table>';
}
function buildRank(d) {
  const sr = d.stock_rank||{};
  if (!sr.top_inflow && !sr.top_gainers && !sr.top_losers) { document.getElementById('c_rank').innerHTML='<div class="empty">暂无数据</div>'; return; }
  document.getElementById('c_rank').innerHTML = `
    <div class="tabs">
      <button id="t_in" class="${rankTab==='top_inflow'?'active':''}" onclick="setRank('top_inflow')">主力净流入</button>
      <button id="t_up" class="${rankTab==='top_gainers'?'active':''}" onclick="setRank('top_gainers')">涨幅</button>
      <button id="t_dn" class="${rankTab==='top_losers'?'active':''}" onclick="setRank('top_losers')">跌幅</button>
    </div>
    <div id="rank_head" style="font-size:13px;font-weight:600;margin-bottom:4px;"></div>
    <div id="rank_body"></div>`;
  renderRankTable(d);
}
function setRank(t) { rankTab = t; ['top_inflow','top_gainers','top_losers'].forEach(k=>{const b=document.getElementById('t_'+(k==='top_inflow'?'in':k==='top_gainers'?'up':'dn')); if(b) b.classList.toggle('active', k===t);}); renderRankTable(window.__DATA__); }

let stockSel = 0, stockChart = null;
function buildStockChart(d) {
  const list = (d.stock_technicals||[]).filter(x=>x.close_series && x.close_series.length>=2);
  const host = document.getElementById('c_stock');
  if (!list.length) { host.innerHTML='<div class="empty">暂无个股走势数据</div>'; return; }
  host.innerHTML = `
    <div style="margin-bottom:8px"><select id="stock_sel" onchange="stockSel=this.selectedIndex; drawStockLine()"></select>
    <span id="stock_meta" style="font-size:12px;color:var(--muted);margin-left:10px"></span></div>
    <div id="c_stock_line" style="width:100%;height:340px"></div>`;
  const sel = document.getElementById('stock_sel');
  list.forEach((x,i)=>{ const o=document.createElement('option'); o.value=i; o.textContent=`${x.name||''} ${x.code||''}`.trim(); sel.appendChild(o); });
  sel.selectedIndex = Math.min(stockSel, list.length-1);
  stockSel = sel.selectedIndex;
  window.__STOCK_LIST__ = list;
  drawStockLine();
}
function drawStockLine() {
  const list = window.__STOCK_LIST__||[];
  const it = list[stockSel]||list[0];
  if (!it) return;
  const dates = it.date_series||it.close_series.map((_,i)=>i+1);
  const series = it.close_series;
  const markLines = [];
  if (it.high20!=null) markLines.push({yAxis:it.high20, lineStyle:{color:COLORS.up,type:'dashed'}, label:{formatter:'高 '+it.high20, fontSize:10}});
  if (it.low20!=null) markLines.push({yAxis:it.low20, lineStyle:{color:COLORS.down,type:'dashed'}, label:{formatter:'低 '+it.low20, fontSize:10}});
  if (stockChart) stockChart.dispose();
  stockChart = echarts.init(document.getElementById('c_stock_line'),'light'); charts.push(stockChart);
  stockChart.setOption({
    tooltip:{trigger:'axis', formatter:p=>`${p[0].name}<br/>收盘: ${fmt(p[0].value)}`},
    grid:{left:54, right:24, top:18, bottom:30},
    xAxis:{type:'category', data:dates, axisLabel:{fontSize:10, interval:Math.floor(dates.length/4)}},
    yAxis:{type:'value', scale:true, axisLabel:{formatter:v=>fmt(v)}},
    series:[{type:'line', data:series, smooth:true, symbol:'none', lineStyle:{color:COLORS.brand,width:2},
      areaStyle:{color:'rgba(37,99,235,0.08)'},
      markLine:{symbol:'none', data:markLines},
      markPoint:{data:[{type:'max',name:'最高'},{type:'min',name:'最低'}], symbolSize:34, label:{fontSize:10}}}]
  });
  document.getElementById('stock_meta').textContent = `收盘 ${fmt(it.close)} · 20日高 ${fmt(it.high20)} · 低 ${fmt(it.low20)} · MACD ${it.macd_state||'-'} · 获利% ${fmt(it.cyq_profit_pct)}`;
}

function layout(d) {
  document.getElementById('meta').textContent = `日期 ${d.date||'-'} ｜ 来源: 美股IP/GitHub Actions 自动采集`;
  const s = d.summary||'';
  document.getElementById('summary').innerHTML = s ? `<strong>盘面总结：</strong>${s}` : '';
  document.getElementById('root').className = 'grid';
  document.getElementById('root').innerHTML = `
    <div class="card"><h2>国内指数 <span class="tag">涨跌%</span></h2><div id="c_index" class="chart"></div></div>
    <div class="card"><h2>两融 <span class="tag">亿</span></h2><div id="c_margin" class="chart"></div></div>
    <div class="card"><h2>宽基ETF资金流 <span class="tag">主力净流入亿</span></h2><div id="c_etf" class="chart"></div></div>
    <div class="card"><h2>行业板块资金流 <span class="tag">TOP10</span></h2><div id="c_sector" class="chart"></div></div>
    <div class="card"><h2>赛道拥挤度 <span class="tag">成交占比%</span></h2><div id="c_track" class="chart"></div></div>
    <div class="card"><h2>涨停情绪</h2><div id="c_sentiment"></div></div>
    <div class="card"><h2>量价异动 <span class="tag">放量突破/缩量回调/底部放量</span></h2><div id="c_pva" class="chart"></div></div>
    <div class="card"><h2>龙虎榜机构净买 <span class="tag">TOP15</span></h2><div id="c_lhb" class="chart"></div></div>
    <div class="card" style="grid-column:1/-1"><h2>个股排名</h2><div id="c_rank"></div></div>
    <div class="card" style="grid-column:1/-1"><h2>个股走势 <span class="tag">主力净流入TOP20 · 近30日收盘</span></h2><div id="c_stock"></div></div>`;
  buildIndexChart(d); buildMarginChart(d); buildEtfChart(d); buildSectorChart(d);
  buildTrackChart(d); buildSentimentKpi(d); buildPvaChart(d); buildLhbChart(d); buildRank(d); buildStockChart(d);
  window.addEventListener('resize', ()=>charts.forEach(c=>c.resize()));
}

function loadData() {
  const params = new URLSearchParams(location.search);
  const file = params.get('file') || './data/latest_review.json';
  fetch(file).then(r=>{ if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); })
    .then(d=>{ window.__DATA__=d; layout(d); })
    .catch(e=>{
      document.getElementById('root').className='';
      document.getElementById('root').innerHTML = `<div class="err">加载数据失败：${e.message}<br/>请通过本地静态服务器访问（如 <code>npx http-server -p 8080</code> 后打开 <code>http://localhost:8080/dashboard/review.html</code>），并通过 runner 生成 <code>data/latest_review.json</code>。</div>`;
    });
}
loadData();
</script>
</body>
</html>
